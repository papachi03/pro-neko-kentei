<svg viewBox="0 0 420 620" xmlns="http://www.w3.org/2000/svg">
  <!-- =====================================================
       ぷろ猫けんてい 基準キャラクター v3（通常待機）
       reference/01_idle.jpg の「可愛さ・脱力感」再現を最優先
       ・完全な楕円/左右対称を避け、手描きの揺らぎを残す
       ・構造: cat-shadow / cat-tail / cat-body / cat-head
       ・tail は通常時は胴体の裏（攻撃時のみJSで前面へ）
       線: 外形 #4a4a4a 5px / 顔パーツ 3.5-4px
       塗り: #fffdf8（白〜ごく薄いクリーム）
       ===================================================== -->

  <!-- 影 -->
  <ellipse id="cat-shadow" cx="214" cy="568" rx="160" ry="22" fill="#ece4d2" opacity="0.8"/>

  <!-- 尻尾：太く柔らかく、右側から右下へぽてっと湾曲 -->
  <g id="cat-tail">
    <path id="tail-path"
          d="M 284 420
             C 366 442 410 510 402 572
             C 398 602 366 608 352 592
             C 344 582 348 568 360 560
             C 368 534 342 500 260 478
             Z"
          fill="#fffdf8" stroke="#4a4a4a" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- 胴体：肩は細く、お腹〜お尻へ柔らかく広がる洋なし型 -->
  <g id="cat-body">
    <path d="M 158 238
             C 134 288 122 348 120 410
             C 118 478 136 542 174 552
             L 256 552
             C 298 548 320 502 323 448
             C 327 382 314 298 284 238
             Z"
          fill="#fffdf8" stroke="#4a4a4a" stroke-width="5" stroke-linejoin="round"/>
    <!-- 後ろ足（右のもも）内側ライン -->
    <path d="M 290 388 C 322 424 326 494 296 544"
          fill="none" stroke="#4a4a4a" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 前足：下半身から見える太めの2本。緩いカーブ -->
    <path d="M 160 444 C 155 480 155 510 158 532" fill="none" stroke="#4a4a4a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 197 448 C 195 484 195 512 195 531" fill="none" stroke="#4a4a4a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 227 448 C 229 484 229 512 229 531" fill="none" stroke="#4a4a4a" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 264 444 C 269 480 269 510 266 532" fill="none" stroke="#4a4a4a" stroke-width="4.5" stroke-linecap="round"/>
    <!-- 足先：ぽてっと大きな丸いミトン -->
    <path d="M 149 531
             C 144 552 155 562 178 562
             C 200 562 208 551 203 532"
          fill="#fffdf8" stroke="#4a4a4a" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M 221 532
             C 216 551 224 562 247 562
             C 270 562 280 551 274 531"
          fill="#fffdf8" stroke="#4a4a4a" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- 指先の切れ込み -->
    <path d="M 167 561 q 5 -11 10 -1 M 180 562 q 5 -11 10 -1" fill="none" stroke="#4a4a4a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 236 561 q 5 -11 10 -1 M 249 561 q 5 -11 10 -1" fill="none" stroke="#4a4a4a" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- 頭：横長・頬ふっくら・完全な楕円にしない -->
  <g id="cat-head">
    <!-- 耳：幅広で根元から柔らかく立つ・左右で微妙に違う -->
    <path d="M 118 108 C 96 70 92 40 104 24 C 138 40 172 60 194 76"
          fill="#fffdf8" stroke="#4a4a4a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 300 104 C 320 68 322 38 310 22 C 278 36 246 56 228 70"
          fill="#fffdf8" stroke="#4a4a4a" stroke-width="5" stroke-linejoin="round"/>
    <!-- 顔の輪郭：頬が左右へ張り出し、顎は柔らかく -->
    <path d="M 210 60
             C 152 58 100 82 78 126
             C 62 158 68 198 94 224
             C 122 250 170 260 212 259
             C 256 258 304 246 330 218
             C 354 192 356 152 340 122
             C 318 80 268 62 210 60
             Z"
          fill="#fffdf8" stroke="#4a4a4a" stroke-width="5" stroke-linejoin="round"/>
    <!-- 目：眠そうで少し困った「八の字」・左右非対称 -->
    <g id="cat-eyes-normal">
      <path d="M 162 166 Q 132 174 108 190" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
      <path d="M 258 165 Q 288 173 312 188" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- 鼻＋口元：一体の表情。鼻のすぐ下から左右へ
         ぷっくり垂れた「むにっ」とした口元 -->
    <path d="M 206 196 Q 212 201 218 196" fill="none" stroke="#4a4a4a" stroke-width="3.5" stroke-linecap="round"/>
    <path id="cat-mouth"
          d="M 212 204
             C 200 200 184 202 176 212
             C 168 223 172 238 186 241
             C 198 243 208 236 210 226
             C 213 238 226 243 238 240
             C 251 236 254 221 246 211
             C 239 202 224 200 212 204"
          fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
